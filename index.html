<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBJ + MTL Hand</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      color: cyan;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      z-index: 10;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="status">Loading...</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
    import { MTLLoader } from "three/addons/loaders/MTLLoader.js";

    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0x66ccff, 2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00ccff, 4, 20);
    pointLight.position.set(0, 2, 3);
    scene.add(pointLight);

    const mtlLoader = new MTLLoader();
    mtlLoader.load("./hand.mtl", (materials) => {
      materials.preload();

      const objLoader = new OBJLoader();
      objLoader.setMaterials(materials);

      objLoader.load(
        "./hand.obj",
        (object) => {
          object.scale.set(1.5, 1.5, 1.5);
          object.position.set(0, -1, 0);

          object.traverse((child) => {
            if (child.isMesh) {
              child.material.transparent = true;
              child.material.opacity = 0.75;
              child.material.emissive = new THREE.Color(0x33bbff);
              child.material.emissiveIntensity = 1.2;
            }
          });

          scene.add(object);

          const box = new THREE.Box3().setFromObject(object);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          const maxDim = Math.max(size.x, size.y, size.z);

          controls.target.copy(center);
          camera.position.set(center.x, center.y + maxDim * 0.3, center.z + maxDim * 2.2);
          camera.lookAt(center);

          status.innerText = "Hand loaded successfully";
        },
        undefined,
        (error) => {
          console.error("OBJ load error:", error);
          status.innerText = "Failed to load hand.obj";
        }
      );
    }, undefined, (error) => {
      console.error("MTL load error:", error);
      status.innerText = "Failed to load hand.mtl";
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
