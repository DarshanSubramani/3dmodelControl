<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GhostHands - Expert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f1147, #3b0a45);
      color: #ffffff;
      text-align: center;
      min-height: 100vh;
    }

    h1 {
      margin-top: 24px;
      font-size: 32px;
      color: #f9a8d4;
      letter-spacing: 1px;
    }

    .container {
      position: relative;
      width: 900px;
      max-width: 95%;
      margin: 25px auto;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    video, canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .info {
      margin-top: 12px;
      font-size: 18px;
      color: #e9d5ff;
    }

    .status {
      margin-top: 12px;
      font-size: 16px;
      color: #fbcfe8;
    }

    .controls {
      margin: 24px 0;
    }

    button {
      background: linear-gradient(90deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.35);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <h1>GhostHands - Expert Panel</h1>

  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="info">
    Live hand landmark tracking from webcam
  </div>

  <div class="status" id="statusText">
    Status: Waiting to start camera...
  </div>

  <div class="controls">
    <button onclick="startCamera()">Start Camera</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="expert.js"></script>
</body>
</html>
